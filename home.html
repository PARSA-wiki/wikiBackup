<h2 class="toc-header" id="这是什么组织"> 这是什么组织？</h2>
<ul>
<li>一个管理与其他异常生物或非生物交流管理的组织，旨在管理现今科学无法解释的现象，并尝试令其帮助人类发展，并将对人类有害的异常收容、隔离、摧毁。</li>
</ul>
<h2 class="toc-header" id="数据库有何用"> 数据库有何用？</h2>
<ul>
<li>一切本组织相关信息都将在此记录、归档，包括但不限于异常及其资料、员工信息、组织资料、故事/事故。</li>
</ul>
<h2 class="toc-header" id="何谓异常"> 何谓异常？</h2>
<ul>
<li>一切无法被现今科学解释的事物，包括但不限于生物、地点、区域、现象、信息。</li>
</ul>
